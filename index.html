<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacer</title>
<meta name="description" content="Pacer builds marathon playlists from your Apple Music, matched to your race pace.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --tartan: #C8442A; --paint: #F6F2E9; --board: #0D0D0C; --amber: #FFB21A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--tartan); color: var(--paint);
    font: 400 18px/1.5 Archivo, system-ui, sans-serif; display: flex; flex-direction: column; }
  main { flex: 1; padding: 48px 24px; max-width: 720px; width: 100%; margin: 0 auto; }
  h1 { font: 700 clamp(72px, 18vw, 160px)/0.9 Oswald, sans-serif; margin: 0 0 12px; letter-spacing: -0.01em; }
  .tag { font: 500 14px/1 Oswald, sans-serif; letter-spacing: .25em; text-transform: uppercase; margin: 0 0 48px; }
  .board { background: var(--board); border: 3px solid var(--paint); padding: 24px; }
  .board h2 { font: 500 14px/1 Oswald, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--amber); margin: 0 0 16px; }
  .board p { margin: 0; }
  a { color: var(--amber); text-underline-offset: 3px; }
  footer { padding: 24px; text-align: center; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>PACER</h1>
  <p class="tag">Run to your music.</p>
  <section class="board">
    <h2>Credits</h2>
    <p>Tempo data from <a href="https://getsongbpm.com">GetSongBPM</a> and <a href="https://www.deezer.com">Deezer</a>. Music by Apple Music.</p>
  </section>
</main>
<footer>Pacer is a personal iPhone app for building marathon playlists.</footer>
</body>
</html>
